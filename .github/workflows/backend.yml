name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'src/backend/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'src/backend/**'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout
        working-directory: ${{ github.workspace }}
        run: |
          git config --global safe.directory '*'
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install ripgrep
        run: sudo apt-get install -y --no-install-recommends ripgrep
      - name: Mock-Policy-Audit
        working-directory: ${{ github.workspace }}
        run: bash scripts/audit-no-mocks.sh
      - name: Run ESLint
        run: npx eslint src/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout
        working-directory: ${{ github.workspace }}
        run: |
          git config --global safe.directory '*'
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Initialize database (Supabase)
        run: |
          npm install pg
          node -e "
            const {Pool}=require('pg');
            const fs=require('fs');
            const schema=fs.readFileSync('src/database/schema.sql','utf8');
            const pool=new Pool({
              host:process.env.DB_HOST,
              port:process.env.DB_PORT,
              database:process.env.DB_NAME,
              user:process.env.DB_USER,
              password:process.env.DB_PASSWORD,
              ssl:{rejectUnauthorized:false}
            });
            pool.query(schema).then(()=>{console.log('Schema geladen');pool.end()}).catch(e=>{console.error('Fehler:',e.message);pool.end();process.exit(1)});
          "
        env:
          DB_HOST: ${{ secrets.SUPABASE_TEST_HOST }}
          DB_PORT: ${{ secrets.SUPABASE_TEST_PORT }}
          DB_NAME: ${{ secrets.SUPABASE_TEST_DB }}
          DB_USER: ${{ secrets.SUPABASE_TEST_USER }}
          DB_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
      - name: Run tests
        run: npm test
        env:
          DB_HOST: ${{ secrets.SUPABASE_TEST_HOST }}
          DB_PORT: ${{ secrets.SUPABASE_TEST_PORT }}
          DB_NAME: ${{ secrets.SUPABASE_TEST_DB }}
          DB_USER: ${{ secrets.SUPABASE_TEST_USER }}
          DB_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
          DB_SSL: "true"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout
        working-directory: ${{ github.workspace }}
        run: |
          git config --global safe.directory '*'
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Compile TypeScript
        run: npx tsc --noEmit
