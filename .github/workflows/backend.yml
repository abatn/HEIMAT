name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'src/backend/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'src/backend/**'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout
        working-directory: ${{ github.workspace }}
        run: |
          git config --global safe.directory '*'
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install ripgrep
        run: sudo apt-get install -y --no-install-recommends ripgrep
      - name: Mock-Policy-Audit
        working-directory: ${{ github.workspace }}
        run: bash scripts/audit-no-mocks.sh
      - name: Run ESLint
        run: npx eslint src/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: heimat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        working-directory: ${{ github.workspace }}
        run: |
          git config --global safe.directory '*'
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Initialize database
        run: psql -f src/database/schema.sql postgresql://postgres:postgres@localhost:5432/heimat_test
      - name: Run tests
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: heimat_test
          DB_USER: postgres
          DB_PASSWORD: postgres

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout
        working-directory: ${{ github.workspace }}
        run: |
          git config --global safe.directory '*'
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Compile TypeScript
        run: npx tsc --noEmit
